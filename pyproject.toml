[project]
name = "drive-replay"
version = "0.4.1"
description = "Replay recorded drives through an ADAS stack on x86: run command, bug replay, CI verdicts"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
convert = ["mcap>=1.1", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.6", "mcap>=1.1"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510", "RUF100"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# report generator: long Markdown string literals
"scripts/reproduce_vdyn.py" = ["E501"]
"scripts/reproduce_mpred.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tools"]
